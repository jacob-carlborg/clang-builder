name: CI

on:
  push:
    branches: '*'
    tags: v*
  pull_request:
    branches:
      - master

env:
  MACOSX_DEPLOYMENT_TARGET: 10.9
  sdk_version: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.data.target_triple_suffix }}
    runs-on: ${{ matrix.data.os.host }}
    defaults:
      run:
        shell: bash
    env:
      BUILDER_ARCH: ${{ matrix.arch }}
      BUILDER_CROSS_COMPILE: ${{ matrix.data.cross_compile }}
      BUILDER_OS: ${{ matrix.data.os.target }}
      BUILDER_TARGET_TRIPLE: ${{ matrix.arch }}-${{ matrix.data.target_triple_suffix }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        data:
          - target_triple_suffix: apple-macos10.9
            os:
              target: macos
              host: macOS-latest

          - target_triple_suffix: pc-windows-msvc
            os:
              target: windows
              host: windows-latest

        include:
          - arch: arm64
            data:
              cross_compile: true
              target_triple_suffix: apple-macos11.0
              os:
                target: macos
                host: macOS-latest

          - arch: x86_64
            data:
              cross_compile: true
              target_triple_suffix: unknown-freebsd13.1
              install_sdk: true
              os:
                target: FreeBSD
                host: ubuntu-latest

          - arch: x86
            data:
              cross_compile: true
              target_triple_suffix: pc-windows-msvc
              os:
                target: windows
                host: windows-latest

    steps:
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies
        if: runner.os == 'Windows'
        run: choco install ninja

      # For cross compiling targets not native to GitHub Actions, which runs on
      # Linux runners.
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y ninja-build

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SDK
        if: matrix.data.install_sdk
        run: |
          curl -L -o sdk.tar.xz --retry 3 'https://github.com/d-cross-compiler/sdk-extractor/releases/download/v${{ env.sdk_version }}/sdk-${{ env.sdk_version }}-${{ env.BUILDER_TARGET_TRIPLE }}.tar.xz'
          tar xf sdk.tar.xz

      - uses: ./.github/workflows/support/shared
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Setup tmate session
      #   if: failure()
      #   uses: mxschmitt/action-tmate@v3

  build_linux:
    name: ${{ matrix.arch }}-alpine-linux-musl
    runs-on: ubuntu-latest
    container: alpine:3.18
    env:
      BUILDER_ARCH: ${{ matrix.arch }}
      BUILDER_CROSS_COMPILE: ${{ matrix.data.cross_compile }}
      BUILDER_OS: linux
      BUILDER_TARGET_TRIPLE: ${{ matrix.arch }}-alpine-linux-musl
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - name: Install dependencies
        run: apk add --no-cache bash curl git bzip2 xz g++ gcc cmake python3 ninja

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/workflows/support/shared
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
